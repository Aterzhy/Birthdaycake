<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#170f2b">
<title>Aleksandra 34</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,600&family=Figtree:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --night:#170f2b; --plum:#2a1b4d; --cream:#fff3e4; --pink:#ff8fb1; --rasp:#c2305f; --gold:#ffc65a; --teal:#7fd9cf;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Figtree",-apple-system,"SF Pro Text",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{color:var(--cream);font-family:var(--sans);position:relative}
body::before{ /* room light from the candles */
  content:"";position:fixed;inset:0;
  background:radial-gradient(70% 45% at 50% 46%,rgba(255,168,70,.30),rgba(255,120,90,.08) 55%,transparent 75%),
             linear-gradient(180deg,#120a24,var(--night) 40%,var(--plum));
  z-index:0;transition:opacity 1.2s ease;
}
body::after{ /* celebration light */
  content:"";position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.6s ease .4s;
  background:radial-gradient(80% 50% at 50% 40%,rgba(255,110,170,.22),transparent 70%),
             radial-gradient(60% 40% at 20% 85%,rgba(127,217,207,.16),transparent 70%);
}
body.out::after{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 20px}
#cake{width:min(86vw,350px);height:auto;overflow:visible;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite;animation-delay:calc(var(--i)*-.23s)}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1.5deg)}35%{transform:scale(.93,1.08) rotate(1.8deg)}70%{transform:scale(1.04,.94) rotate(-.5deg)}}
.out .flame{animation:snuff .55s ease-in calc(var(--i)*90ms) both}
@keyframes snuff{0%{transform:scale(1,1)}35%{transform:skewX(-26deg) scale(1.15,.88)}100%{transform:skewX(-38deg) scale(.1,.04);opacity:0}}
#glow{transition:opacity .9s ease .3s}
.out #glow{opacity:0}
.smoke{transform-box:fill-box;transform-origin:center;animation:rise 1.8s ease-out forwards}
@keyframes rise{from{transform:translate(0,0) scale(.5);opacity:.7}to{transform:translate(var(--dx),-70px) scale(2.6);opacity:0}}
body.out::before{opacity:.55}
.dock{position:relative;width:100%;height:190px;display:flex;align-items:flex-start;justify-content:center;padding-top:22px}
#blow{
  font:600 21px/1 var(--sans);letter-spacing:.02em;color:#3b1230;
  padding:18px 46px;border:0;border-radius:999px;cursor:pointer;
  background:linear-gradient(180deg,#ffe3a8,var(--gold));
  box-shadow:0 0 0 6px rgba(255,198,90,.14),0 10px 30px rgba(255,170,60,.35);
  transition:transform .15s ease,opacity .5s ease,box-shadow .2s;
  animation:breathe 2.4s ease-in-out infinite;
}
@keyframes breathe{50%{box-shadow:0 0 0 12px rgba(255,198,90,.07),0 10px 34px rgba(255,170,60,.5)}}
#blow:active{transform:scale(.95)}
#blow:focus-visible{outline:3px solid var(--cream);outline-offset:4px}
.out #blow{opacity:0;pointer-events:none;transform:scale(.85);animation:none}
#wish{position:absolute;inset:0;padding-top:4px;text-align:center;pointer-events:none}
#wish>*{margin:0;opacity:0;transform:translateY(14px) scale(.96);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.out #wish>*{opacity:1;transform:none}
.g{font:italic 500 22px/1.2 var(--serif);color:var(--cream);transition-delay:.9s!important}
h1{font:italic 600 clamp(46px,14.5vw,60px)/1.05 var(--serif);letter-spacing:-.01em;margin-top:4px!important;
  background:linear-gradient(180deg,#fff3e4,#ffc4d6 60%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,120,170,.45));transition-delay:1.15s!important}
.s{font:500 15px/1 var(--serif);letter-spacing:.14em;color:var(--teal);margin-top:14px!important;transition-delay:1.7s!important}
@media (prefers-reduced-motion:reduce){
  .flame{animation:none}#blow{animation:none}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="stage">
  <svg id="cake" viewBox="0 0 320 320" role="img" aria-label="Tort urodzinowy ze świeczkami">
    <defs>
      <radialGradient id="g1"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
      <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8a1f"/><stop offset=".6" stop-color="#ffc247"/><stop offset="1" stop-color="#fff0a8"/></linearGradient>
    </defs>
    <ellipse cx="160" cy="300" rx="150" ry="17" fill="#e8d8f2"/>
    <ellipse cx="160" cy="296" rx="136" ry="12" fill="#fbf4ff"/>
    <path d="M40,206v80a120,14 0 0 0 240,0v-80z" fill="#f2c99b"/>
    <g id="drips1" fill="#ff8fb1"></g>
    <ellipse cx="160" cy="206" rx="120" ry="14" fill="#ffa9c4"/>
    <text x="160" y="270" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-style="italic" font-weight="600" font-size="48" fill="#c2305f">34</text>
    <path d="M80,130v76a80,10 0 0 0 160,0v-76z" fill="#fbe0c0"/>
    <g id="drips2" fill="#ff8fb1"></g>
    <ellipse cx="160" cy="130" rx="80" ry="10" fill="#ffb9cf"/>
    <g id="glow"><ellipse cx="160" cy="80" rx="110" ry="60" fill="url(#g1)"/></g>
    <g id="candles"></g>
  </svg>
  <div class="dock">
    <button id="blow" type="button">Zdmuchnij</button>
    <div id="wish" aria-live="polite">
      <p class="g">Wszystkiego najlepszego z okazji urodzin,</p>
      <h1>Aleksandra</h1>
      <p class="s">zwany MY BABY ❤️</p>
    </div>
  </div>
</main>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg",N=7;
  var cols=["#7fd9cf","#ffc65a","#ff8fb1"];
  function drips(id,x0,x1,y,hs){
    var g=document.getElementById(id),n=hs.length,w=(x1-x0)/n,h="";
    for(var i=0;i<n;i++){h+='<rect x="'+(x0+i*w+w*.18)+'" y="'+y+'" width="'+(w*.64)+'" height="'+hs[i]+'" rx="'+(w*.32)+'"/>';}
    g.innerHTML=h;
  }
  drips("drips1",40,280,206,[22,34,16,30,20,38,18,28,24,34,16,26]);
  drips("drips2",80,240,130,[18,28,14,24,30,16,22,26]);

  var cg=document.getElementById("candles"),pos=[];
  for(var i=0;i<N;i++){
    var dx=(i-(N-1)/2)*24,x=160+dx,by=129+6*Math.sqrt(Math.max(0,1-Math.pow(dx/80,2))),top=by-40;
    pos.push([x,top]);
    var g=document.createElementNS(NS,"g");
    g.innerHTML='<rect x="'+(x-4)+'" y="'+top+'" width="8" height="'+(by-top)+'" rx="2" fill="'+cols[i%3]+'"/>'+
      '<rect x="'+(x-4)+'" y="'+(top+8)+'" width="8" height="3" fill="rgba(255,255,255,.55)"/>'+
      '<rect x="'+(x-.7)+'" y="'+(top-4)+'" width="1.4" height="5" fill="#3a2a2a"/>'+
      '<g transform="translate('+x+','+(top-3)+')"><g class="flame" style="--i:'+i+'">'+
      '<path d="M0,0C-8,-8 -5,-20 0,-30C5,-20 8,-8 0,0Z" fill="url(#fl)"/>'+
      '<path d="M0,-1C-3,-5 -2,-11 0,-15C2,-11 3,-5 0,-1Z" fill="#fffbe0"/></g></g>';
    cg.appendChild(g);
  }

  /* ---------- effects ---------- */
  var cv=document.getElementById("fx"),ctx=cv.getContext("2d"),W,H,dpr;
  function resize(){dpr=Math.min(window.devicePixelRatio||1,3);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
  resize();addEventListener("resize",resize);
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  var sparks=[],conf=[],rockets=[],running=false,party=false;
  var palette=[330,45,170,280,15,200];
  function R(a,b){return a+Math.random()*(b-a)}

  function burst(x,y){
    var hue=palette[Math.floor(Math.random()*palette.length)],n=reduce?30:78;
    for(var i=0;i<n;i++){
      var a=Math.random()*6.2832,s=R(.6,1)*R(2,5.4);
      sparks.push({x:x,y:y,px:x,py:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:R(.011,.02),h:hue+R(-18,18)});
    }
    for(var j=0;j<14;j++){
      var b=Math.random()*6.2832;
      sparks.push({x:x,y:y,px:x,py:y,vx:Math.cos(b)*1.2,vy:Math.sin(b)*1.2,l:1.2,d:.02,h:50});
    }
  }
  function launch(){
    var tx=R(W*.12,W*.88);
    rockets.push({x:tx+R(-30,30),y:H,tx:tx,ty:R(H*.12,H*.42)});
  }
  function confetti(){
    var n=reduce?50:170,cs=["#ff8fb1","#ffc65a","#7fd9cf","#fff3e4","#b79cff","#ff6b6b"];
    for(var i=0;i<n;i++){
      var left=i%2===0,s=R(9,20),a=R(.9,1.35);
      conf.push({x:left?-10:W+10,y:H*.9,vx:(left?1:-1)*s*Math.cos(a)*.7,vy:-s*Math.sin(a)*1.15,
        w:R(6,11),h:R(9,16),r:R(0,6.28),vr:R(-.25,.25),p:R(0,6.28),c:cs[i%cs.length]});
    }
  }
  function drizzle(){
    var cs=["#ff8fb1","#ffc65a","#7fd9cf","#fff3e4","#b79cff"];
    conf.push({x:R(0,W),y:-14,vx:R(-.6,.6),vy:R(1,2),w:R(6,10),h:R(9,14),r:R(0,6.28),vr:R(-.15,.15),p:R(0,6.28),c:cs[Math.floor(R(0,5))]});
  }

  var last=0;
  function frame(t){
    if(!running)return;
    ctx.clearRect(0,0,W,H);
    var k=Math.min((t-last)/16.7||1,3);last=t;

    for(var i=conf.length-1;i>=0;i--){
      var c=conf[i];
      c.vy=Math.min(c.vy+.28*k,3.4);c.vx*=Math.pow(.985,k);
      c.p+=.09*k;c.x+=(c.vx+Math.sin(c.p)*.9)*k;c.y+=c.vy*k;c.r+=c.vr*k;
      if(c.y>H+30||c.x<-60||c.x>W+60){conf.splice(i,1);continue}
      ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.scale(1,Math.cos(c.p));
      ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();
    }

    ctx.globalCompositeOperation="lighter";
    for(var r=rockets.length-1;r>=0;r--){
      var o=rockets[r],py=o.y;
      o.y+=(o.ty-o.y)*.045*k+(-2.2*k);o.x+=(o.tx-o.x)*.03*k;
      ctx.strokeStyle="rgba(255,220,160,.8)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x,py+10);ctx.lineTo(o.x,o.y);ctx.stroke();
      if(o.y<=o.ty+10){burst(o.x,o.y);rockets.splice(r,1)}
    }
    ctx.lineCap="round";
    for(var s=sparks.length-1;s>=0;s--){
      var p=sparks[s];
      p.px=p.x;p.py=p.y;p.vx*=Math.pow(.978,k);p.vy=p.vy*Math.pow(.978,k)+.055*k;
      p.x+=p.vx*k;p.y+=p.vy*k;p.l-=p.d*k;
      if(p.l<=0){sparks.splice(s,1);continue}
      ctx.strokeStyle="hsla("+p.h+",100%,"+(55+p.l*15)+"%,"+Math.min(p.l,1)+")";
      ctx.lineWidth=1+p.l*1.6;
      ctx.beginPath();ctx.moveTo(p.px,p.py);ctx.lineTo(p.x,p.y);ctx.stroke();
    }
    ctx.globalCompositeOperation="source-over";

    if(party&&Math.random()<(reduce?.04:.22))drizzle();
    requestAnimationFrame(frame);
  }
  function start(){if(!running){running=true;last=performance.now();requestAnimationFrame(frame)}}

  /* ---------- blow out ---------- */
  var btn=document.getElementById("blow"),done=false;
  btn.addEventListener("click",function(){
    if(done)return;done=true;btn.disabled=true;
    document.body.classList.add("out");
    pos.forEach(function(p,i){
      setTimeout(function(){
        for(var k=0;k<3;k++){
          var c=document.createElementNS(NS,"circle");
          c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1]-4);c.setAttribute("r",3);c.setAttribute("fill","rgba(235,230,245,.55)");
          c.setAttribute("class","smoke");
          c.style.setProperty("--dx",(Math.random()*26-13)+"px");c.style.animationDelay=(k*.22)+"s";
          document.getElementById("cake").appendChild(c);
          setTimeout(function(n){return function(){n.remove()}}(c),2400);
        }
      },i*90+250);
    });
    start();
    setTimeout(function(){party=true;confetti()},700);
    [900,1250,1550,1900,2300,2700,3200].forEach(function(d){setTimeout(launch,d)});
    setTimeout(function(){setInterval(function(){launch();if(Math.random()<.5)setTimeout(launch,250)},1500)},3600);
    setInterval(function(){if(conf.length<40)confetti()},9000);
  });
})();
</script>
</body>
</html>
